name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LwXLabs.Mcp.Template.DotNet.slnx --configfile NuGet.config
      - run: dotnet test LwXLabs.Mcp.Template.DotNet.slnx -c Release --no-restore
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { throw "Inno Setup installation failed" }
          }
      - shell: pwsh
        run: ./scripts/Build-Installer.ps1
      - shell: pwsh
        run: ./scripts/Test-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: artifacts/installer/*.exe
          if-no-files-found: error
